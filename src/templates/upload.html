<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrightMart — load a sales workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0b1220;
    --ink: #e6edf7;
    --ink-dim: #8fa3bd;
    --card: #111a2c;
    --card-edge: #1c2941;
    --blue: #3b82f6;
    --violet: #8b5cf6;
    --red: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(1100px 500px at 85% -10%, rgba(59,130,246,.14), transparent 60%),
      radial-gradient(900px 420px at -10% 0%, rgba(139,92,246,.10), transparent 55%),
      var(--navy);
    color: var(--ink);
    margin: 0;
    display: grid;
    place-items: center;
    min-height: 100vh;
  }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015)), var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 20px;
    padding: 42px 44px;
    width: min(580px, 92vw);
    box-shadow: 0 24px 70px rgba(0,0,0,.45);
  }
  .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 8px; }
  .logo {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, var(--blue), var(--violet));
    display: grid; place-items: center;
    font-weight: 800; font-size: 19px; color: #fff;
    box-shadow: 0 8px 22px rgba(59,130,246,.4);
  }
  h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: .2px; }
  p.sub { color: var(--ink-dim); margin: 4px 0 28px; font-size: 13.5px; }
  .drop {
    border: 1.5px dashed var(--card-edge);
    border-radius: 14px;
    padding: 40px 22px;
    text-align: center;
    cursor: pointer;
    transition: all .18s ease;
    background: rgba(255,255,255,.015);
  }
  .drop:hover, .drop.hover {
    border-color: var(--blue);
    background: rgba(59,130,246,.08);
    transform: translateY(-1px);
  }
  .drop .icon { font-size: 30px; margin-bottom: 10px; opacity: .8; }
  .drop .big { font-size: 14.5px; font-weight: 600; margin-bottom: 5px; }
  .drop .hint { color: var(--ink-dim); font-size: 12px; line-height: 1.5; }
  input[type=file] { display: none; }
  .error {
    background: rgba(248,113,113,.1);
    border: 1px solid rgba(248,113,113,.3);
    color: var(--red);
    border-radius: 10px;
    padding: 11px 15px;
    font-size: 13px;
    margin-bottom: 18px;
  }
  .actions { margin-top: 24px; display: flex; gap: 12px; }
  .btn {
    font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    border-radius: 10px; padding: 11px 22px; flex: 1;
    border: 1px solid var(--card-edge);
    background: rgba(255,255,255,.04); color: var(--ink);
    transition: all .15s ease;
  }
  .btn:hover { background: rgba(255,255,255,.09); transform: translateY(-1px); }
  .btn.primary {
    background: linear-gradient(135deg, var(--blue), #6366f1);
    border-color: transparent; color: #fff;
    box-shadow: 0 8px 20px rgba(59,130,246,.35);
  }
  button:disabled { opacity: .5; cursor: wait; transform: none; }
</style>
</head>
<body>
  <form class="card" action="/upload" method="post" enctype="multipart/form-data" id="form">
    <div class="brand">
      <div class="logo">B</div>
      <div>
        <h1>BrightMart Sales Dashboard</h1>
        <p class="sub" style="margin:2px 0 0">Drop a month's workbook — the report builds from that exact file.</p>
      </div>
    </div>

    {% if error %}<div class="error"><strong>Could not use that file:</strong> {{ error }}</div>{% endif %}

    <label class="drop" id="drop">
      <input type="file" name="file" id="file" accept=".xlsx,.xlsm">
      <div class="icon">📊</div>
      <div class="big" id="label">Drop an .xlsx here or click to choose</div>
      <div class="hint">Validated on upload: required columns · at least one data row · ≤ 25 MB.</div>
    </label>

    <div class="actions">
      <button type="submit" class="btn primary" id="go">Generate report</button>
      {% if has_default %}
      <button type="submit" class="btn" formaction="/use-default" formmethod="post">Use sample file</button>
      {% endif %}
    </div>
  </form>

<script>
  const drop = document.getElementById("drop");
  const file = document.getElementById("file");
  const label = document.getElementById("label");
  const go = document.getElementById("go");
  const form = document.getElementById("form");

  drop.addEventListener("dragover", (e) => {
    e.preventDefault();
    drop.classList.add("hover");
  });
  drop.addEventListener("dragleave", () => drop.classList.remove("hover"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("hover");
    if (e.dataTransfer.files.length) {
      file.files = e.dataTransfer.files;
      updateLabel();
    }
  });
  file.addEventListener("change", updateLabel);
  function updateLabel() {
    if (file.files.length) {
      label.textContent = file.files[0].name;
      go.disabled = false;
    }
  }
  form.addEventListener("submit", () => { go.disabled = true; });
</script>
</body>
</html>
